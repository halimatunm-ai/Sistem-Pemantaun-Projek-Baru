<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sistem Pemantauan Projek JKN Perlis</title>
  
  <meta name="theme-color" content="#0c0e14">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-512.png">
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0c0e14;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- PENTING: Gantikan pautan URL di bawah dengan Web App URL Apps Script anda -->
  <iframe src="URL_WEB_APP_APPS_SCRIPT_ANDA" allowfullscreen></iframe>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(registration => console.log('ServiceWorker berjaya didaftar', registration.scope))
          .catch(error => console.log('Pendaftaran gagal', error));
      });
    }
  </script>
</body>
</html>
